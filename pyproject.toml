[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-voice-agent"
version = "2.0.0"
description = "Unified Real-Time Conversational AI Voice Agent with Groq Whisper STT, Deepgram Streaming TTS, and Gemini LLM"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "AI Engineering Team" }]

dependencies = [
    # Core API & Web Server
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "websockets>=12.0,<17.0",
    "jinja2>=3.1.0,<4.0.0",
    "python-multipart>=0.0.9",
    "pywebrtc-audio>=0.1.0",
    # Real-Time Cloud Voice Engines
    "groq>=0.9.0,<2.0.0",

    # Core State, Schemas & Networking
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "openai>=1.0.0",

    # RAG Vector Storage & Retrieval
    "redis>=5.0.0,<9.0.0",
    "fastembed>=0.8.0,<1.0.0",

    # Audio Processing & Signal Engineering
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "soundfile>=0.12.0",
    "onnxruntime>=1.17.0",

    # Relational Database Persistence (PostgreSQL)
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
ui = [
    "streamlit>=1.35.0,<2.0.0",
]
local-audio = [
    "faster-whisper>=1.0.0",
    "silero-vad>=5.1.0",
    "kokoro>=0.9.0",
]
pipecat = [
    "pipecat-ai>=0.0.50",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --strict-markers"
filterwarnings = [
    "error",
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.setuptools.packages.find]
where = ["src"]
