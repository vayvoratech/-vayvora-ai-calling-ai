name: CI Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 5 - Checkout Source Code
      - name: Checkout code
        uses: actions/checkout@v4
      # Step 6 - Dependency Installation
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        # Step 7 - Static Code Analysis
      - name: Static Code Analysis
        run: |
          pip install flake8
          flake8 .
       # Step 8 - Compile / Build Check
      - name: Compile Python files
        run: python -m compileall .
        # Step 9 - Unit Testing
      - name: Run Unit Tests
        run: |
          pip install pytest
          pytest -v
        # Step 10 - Security & Vulnerability Scan
      - name: Security Scan
        run: |
          pip install pip-audit
          pip-audit
