<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vayvora AI - Conversational Voice Agent</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: #111827;
            --surface-border: #1f2937;
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.35);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --green: #10b981;
            --red: #ef4444;
            --amber: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--surface-border);
            padding-bottom: 16px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--primary);
        }

        .status-badge {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 9999px;
            background: #1f2937;
            color: var(--text-muted);
            border: 1px solid #374151;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge.connected {
            color: var(--green);
            border-color: rgba(16, 185, 129, 0.3);
            background: rgba(16, 185, 129, 0.1);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        .visualizer-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 0;
            gap: 20px;
        }

        .mic-orb {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #1f2937;
            border: 2px solid var(--surface-border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .mic-orb.active {
            border-color: var(--primary);
            box-shadow: 0 0 25px var(--primary-glow);
            animation: pulse 2s infinite ease-in-out;
        }

        .mic-orb.speaking {
            border-color: var(--green);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.4);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .call-btn {
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--primary);
            color: #0b0f19;
        }

        .call-btn.hangup {
            background: var(--red);
            color: #fff;
        }

        .telemetry-bar {
            background: #090d16;
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            padding: 12px 16px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            font-size: 13px;
        }

        .telemetry-item span {
            color: var(--text-muted);
            display: block;
            margin-bottom: 2px;
        }

        .telemetry-item strong {
            color: var(--primary);
        }

        .log-container {
            height: 240px;
            overflow-y: auto;
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            padding: 16px;
            background: #090d16;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 14px;
        }

        .log-entry {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-entry.user { align-items: flex-end; }
        .log-entry.agent { align-items: flex-start; }

        .log-bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.4;
        }

        .user .log-bubble {
            background: #1e3a8a;
            color: #dbeafe;
            border-bottom-right-radius: 2px;
        }

        .agent .log-bubble {
            background: #1f2937;
            color: #f3f4f6;
            border-bottom-left-radius: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>VAYVORA VOICE AGENT</h1>
        <div id="statusBadge" class="status-badge">
            <div class="status-dot"></div>
            <span id="statusText">Disconnected</span>
        </div>
    </div>

    <div class="visualizer-area">
        <div id="micOrb" class="mic-orb">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="22"></line>
            </svg>
        </div>
        <button id="callBtn" class="call-btn">Start Conversation</button>
    </div>

    <div class="telemetry-bar">
        <div class="telemetry-item">
            <span>Query Route</span>
            <strong id="metaRoute">-</strong>
        </div>
        <div class="telemetry-item">
            <span>Route Confidence</span>
            <strong id="metaConfidence">-</strong>
        </div>
        <div class="telemetry-item">
            <span>Active Tool</span>
            <strong id="metaTool">None</strong>
        </div>
    </div>

    <div id="logContainer" class="log-container"></div>
</div>

<script>
    let ws = null;
    let audioCtx = null;
    let micStream = null;
    let micNode = null;
    let scriptProcessor = null;
    let silentGain = null;

    // Continuous scheduled playback state
    let nextPlayTime = 0;
    let activeAudioNodes = [];

    const callBtn = document.getElementById("callBtn");
    const micOrb = document.getElementById("micOrb");
    const statusBadge = document.getElementById("statusBadge");
    const statusText = document.getElementById("statusText");
    const logContainer = document.getElementById("logContainer");

    const metaRoute = document.getElementById("metaRoute");
    const metaConfidence = document.getElementById("metaConfidence");
    const metaTool = document.getElementById("metaTool");

    let currentAgentBubble = null;

    callBtn.addEventListener("click", () => {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            startCall();
        } else {
            endCall();
        }
    });

    async function startCall() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
        if (audioCtx.state === "suspended") {
            await audioCtx.resume();
        }

        nextPlayTime = audioCtx.currentTime;

        const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${wsProtocol}//${window.location.host}/media-stream`;

        ws = new WebSocket(wsUrl);
        ws.binaryType = "arraybuffer";

        ws.onopen = async () => {
            statusBadge.className = "status-badge connected";
            statusText.textContent = "Live Connected";
            callBtn.textContent = "End Call";
            callBtn.classList.add("hangup");
            micOrb.classList.add("active");

            await setupMicrophone();
        };

        ws.onmessage = (event) => {
            if (event.data instanceof ArrayBuffer) {
                scheduleIncomingAudio(event.data);
                return;
            }

            try {
                const msg = JSON.parse(event.data);
                handleServerEvent(msg);
            } catch (err) {
                console.error("JSON parse error:", err);
            }
        };

        ws.onclose = () => endCall();
        ws.onerror = () => endCall();
    }

    async function setupMicrophone() {
        try {
            micStream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    channelCount: 1,
                    sampleRate: 48000,
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            });

            micNode = audioCtx.createMediaStreamSource(micStream);
            scriptProcessor = audioCtx.createScriptProcessor(4096, 1, 1);

            scriptProcessor.onaudioprocess = (e) => {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;

                const inputData = e.inputBuffer.getChannelData(0);
                const pcm16 = new Int16Array(inputData.length);
                for (let i = 0; i < inputData.length; i++) {
                    const s = Math.max(-1, Math.min(1, inputData[i]));
                    pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }

                ws.send(pcm16.buffer);
            };

            silentGain = audioCtx.createGain();
            silentGain.gain.value = 0;

            micNode.connect(scriptProcessor);
            scriptProcessor.connect(silentGain);
            silentGain.connect(audioCtx.destination);
        } catch (err) {
            console.error("Microphone access failed:", err);
            appendLog("System", "Could not access microphone: " + err.message);
            endCall();
        }
    }

    function handleServerEvent(msg) {
        switch (msg.type) {
            case "speech_started":
            case "interrupt":
            case "tts_interrupted":
                purgeAudioQueue();
                micOrb.classList.add("speaking");
                break;

            case "transcript":
                appendLog("User", msg.text);
                micOrb.classList.remove("speaking");
                break;

            case "agent_started":
                currentAgentBubble = appendLog("Agent", "Thinking...");
                break;

            case "agent_telemetry":
                metaRoute.textContent = (msg.route || "general").toUpperCase();
                metaConfidence.textContent = `${(Number(msg.confidence || 0) * 100).toFixed(0)}%`;
                metaTool.textContent = msg.tool_name || "None";
                break;

            case "llm_chunk":
                if (currentAgentBubble) {
                    if (currentAgentBubble.textContent === "Thinking...") {
                        currentAgentBubble.textContent = "";
                    }
                    currentAgentBubble.textContent += msg.text;
                    logContainer.scrollTop = logContainer.scrollHeight;
                }
                break;

            case "llm_complete":
                currentAgentBubble = null;
                break;
        }
    }

    // Precise continuous scheduling eliminates gaps and distortion
    function scheduleIncomingAudio(arrayBuffer) {
        if (!audioCtx) return;

        const int16Array = new Int16Array(arrayBuffer);
        const float32Array = new Float32Array(int16Array.length);

        for (let i = 0; i < int16Array.length; i++) {
            float32Array[i] = int16Array[i] / 32768.0;
        }

        const audioBuffer = audioCtx.createBuffer(1, float32Array.length, 48000);
        audioBuffer.getChannelData(0).set(float32Array);

        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        // If the playback pipeline starved, catch up to current time with 25ms jitter buffer
        if (nextPlayTime < now) {
            nextPlayTime = now + 0.025;
        }

        source.start(nextPlayTime);
        nextPlayTime += audioBuffer.duration;

        activeAudioNodes.push(source);
        source.onended = () => {
            const index = activeAudioNodes.indexOf(source);
            if (index !== -1) {
                activeAudioNodes.splice(index, 1);
            }
        };
    }

    function purgeAudioQueue() {
        activeAudioNodes.forEach(node => {
            try {
                node.stop();
                node.disconnect();
            } catch (_) {}
        });
        activeAudioNodes = [];
        if (audioCtx) {
            nextPlayTime = audioCtx.currentTime;
        }
    }

    function endCall() {
        if (ws) {
            ws.close();
            ws = null;
        }
        if (micStream) {
            micStream.getTracks().forEach(t => t.stop());
            micStream = null;
        }
        if (scriptProcessor) {
            scriptProcessor.disconnect();
            scriptProcessor = null;
        }
        if (micNode) {
            micNode.disconnect();
            micNode = null;
        }
        if (silentGain) {
            silentGain.disconnect();
            silentGain = null;
        }
        purgeAudioQueue();

        statusBadge.className = "status-badge";
        statusText.textContent = "Disconnected";
        callBtn.textContent = "Start Conversation";
        callBtn.classList.remove("hangup");
        micOrb.classList.remove("active", "speaking");
    }

    function appendLog(speaker, text) {
        const row = document.createElement("div");
        row.className = `log-entry ${speaker.toLowerCase()}`;

        const bubble = document.createElement("div");
        bubble.className = "log-bubble";
        bubble.textContent = text;

        row.appendChild(bubble);
        logContainer.appendChild(row);
        logContainer.scrollTop = logContainer.scrollHeight;

        return bubble;
    }
</script>

</body>
</html>
